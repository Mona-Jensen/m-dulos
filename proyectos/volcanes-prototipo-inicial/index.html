<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chile Volcánico</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: black;
            color: white;
            padding: 10px;
            z-index: 1000;
            border-radius: 5px;
            font-family: Arial;
        }
    </style>
</head>
<body>
    <div class="info">🌋 Cargando volcanes...</div>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar mapa
        const map = L.map('map').setView([-39.0, -71.5], 6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        // Cargar volcanes
        fetch('volcanoes.json')
            .then(response => response.json())
            .then(volcanoes => {
                document.querySelector('.info').innerHTML = `✅ ${volcanoes.length} volcanes cargados`;
                
                volcanoes.forEach(v => {
                    const marker = L.circleMarker([v.coordinates[0], v.coordinates[1]], {
                        radius: 10,
                        fillColor: v.status === 'Amarilla' ? '#ffcc00' : '#00e676',
                        color: 'white',
                        weight: 2,
                        fillOpacity: 0.8
                    }).addTo(map);
                    
                    marker.bindPopup(`<b>${v.name}</b><br>${v.status}<br>Riesgo #${v.risk_rank}`);
                })
            })
            .catch(error => {
                document.querySelector('.info').innerHTML = '❌ Error cargando volcanes: ' + error.message;
                console.error(error);
            });
    </script>
</body>
</html>
